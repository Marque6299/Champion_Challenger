    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }

        /* Layout */
        .layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #0078d4;
            color: white;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            min-height: 60px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        .sidebar.collapsed .sidebar-title {
            display: none;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 22px;
            padding: 5px;
        }

        .nav-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .nav-menu {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 14px 12px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255,255,255,0.12);
            color: white;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.22);
        }

        .nav-btn.active {
            background: white;
            color: #0078d4;
        }

        .icon {
            min-width: 24px;
            text-align: center;
            font-size: 18px;
        }

        .text {
            white-space: nowrap;
        }

        .sidebar.collapsed .text {
            display: none;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.1);
        }

        .sidebar.collapsed .sidebar-footer {
            display: none;
        }

        /* Sidebar Ad Container */
        .sidebar-ad-box {
            display: none;
            min-height: 250px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 12px;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .legal-links {
            text-align: center;
        }

        .legal-links a {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }

        .legal-links a:hover {
            color: white;
            text-decoration: underline;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Ad Container */
        .top-ad-banner {
            display: none;
            width: 100%;
            min-height: 70px;
            background: #fff;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #ddd;
            overflow: hidden;
            position: relative;
        }

        /* Fallback House Banners */
        .fallback-banner {
            display: none;
            width: 100%;
            height: 100%;
            text-decoration: none;
            color: inherit;
        }

        .fallback-top-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 10px 20px;
            background: linear-gradient(90deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
        }

        .fallback-top-content span {
            font-size: 14px;
            font-weight: 600;
        }

        .fallback-btn {
            background: #ff9800;
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .fallback-sidebar-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
            text-align: center;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            height: 100%;
            gap: 12px;
        }

        .report-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 1000;
                height: 100vh;
            }

            .sidebar.collapsed {
                width: 0;
            }

            .sidebar.collapsed * {
                display: none;
            }
        }
    </style>
</head>

<script>

    const report1 = "https://app.powerbi.com/view?r=eyJrIjoiOWM5YzhhNDgtYTM1YS00ZWU0LWI2MjEtNzEzMzYwZGJkYzFmIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";

    const report3 = "https://app.powerbi.com/view?r=eyJrIjoiOWQxMGZlMDAtYzEzZC00MDA4LTkwNDEtNDNmNDBkOTg3ZTI3IiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";
    const report4 = "https://app.powerbi.com/view?r=eyJrIjoiNjQ3NDM0MDEtMGZjNy00NTgwLTk5MGYtODA4YWYxMWZjZTNiIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";
    const report5 = "https://app.powerbi.com/view?r=eyJrIjoiODgxNTAyOWEtMDY3Yy00YTYyLWJlZGEtZjRiMjM0NzE5OTM3IiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";

    // Smartlink Target Route (Netlify Rewritten Route or Direct Smartlink)
    const SMARTLINK_URL = "https://www.profitableratecpmnetwork.com/i76n71tt4k?key=9f561ad0b2d1737046e26658af21fb4d";
    let smartlinkTriggered = false;

    // Report Switcher + First-Click Smartlink Trigger
    function loadReport(url, button) {
        if (!smartlinkTriggered && SMARTLINK_URL !== "") {
            window.open(SMARTLINK_URL, '_blank');
            smartlinkTriggered = true;
        }

        document.getElementById("reportFrame").src = url;
        document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
    }

    // Sidebar Toggle
    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
    }

    // Adsterra Monitor with Method 4 Fallback Trigger
    function setupAdWithFallback(containerId, fallbackId, displayStyle = 'flex') {
        const container = document.getElementById(containerId);
        const fallbackEl = document.getElementById(fallbackId);
        if (!container) return;

        let adsterraLoaded = false;
        let timerStarted = false;

        function handleAdsterraSuccess() {
            if (adsterraLoaded) return;
            adsterraLoaded = true;

            // Hide fallback banner and display Adsterra script content
            if (fallbackEl) fallbackEl.style.display = 'none';
            container.style.display = displayStyle;

            // 2-minute auto-hide timer for live Adsterra unit
            if (!timerStarted) {
                timerStarted = true;
                setTimeout(() => {
                    container.style.display = 'none';
                }, 120000);
            }
        }

        function handleFallbackDisplay() {
            if (adsterraLoaded) return;
            container.style.display = displayStyle;
            if (fallbackEl) fallbackEl.style.display = 'block';
        }

        // Observer checks for Adsterra dynamic script injection
        const observer = new MutationObserver(() => {
            const hasIframe = container.querySelector('iframe') !== null;
            if (hasIframe) {
                handleAdsterraSuccess();
            }
        });

        observer.observe(container, { childList: true, subtree: true });

        // Fallback Timeout: If Adsterra is blocked or fails after 3 seconds, render the fallback banner
        setTimeout(() => {
            const hasIframe = container.querySelector('iframe') !== null;
            if (hasIframe) {
                handleAdsterraSuccess();
            } else {
                handleFallbackDisplay();
            }
        }, 3000);
    }

    window.addEventListener('DOMContentLoaded', () => {
        setupAdWithFallback('topAdBanner', 'topFallback', 'flex');
        setupAdWithFallback('sidebarAdBox', 'sidebarFallback', 'flex');
    });
</script>
