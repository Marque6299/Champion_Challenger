<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Reports Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }

        /* Layout */
        .layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #0078d4;
            color: white;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            min-height: 60px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        .sidebar.collapsed .sidebar-title {
            display: none;
        }

        /* Toggle Button */
        .toggle-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 22px;
            padding: 5px;
        }

        /* Navigation */
        .nav-menu {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;

            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;

            padding: 14px 12px;
            font-size: 14px;
            font-weight: 600;

            background: rgba(255,255,255,0.12);
            color: white;

            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.22);
        }

        .nav-btn.active {
            background: white;
            color: #0078d4;
        }

        .icon {
            min-width: 24px;
            text-align: center;
            font-size: 18px;
        }

        .text {
            white-space: nowrap;
        }

        .sidebar.collapsed .text {
            display: none;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            background: #f5f5f5;
            height: 100vh;
        }

        .report-container {
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        /* Mobile */
        @media (max-width: 768px) {

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 1000;
                height: 100vh;
            }

            .sidebar.collapsed {
                width: 0;
            }

            .sidebar.collapsed * {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="layout">

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">

        <div class="sidebar-header">
            <span class="sidebar-title">Reports Portal</span>

            <button class="toggle-btn" onclick="toggleSidebar()">
                ☰
            </button>
        </div>

        <div class="nav-menu">

            <button class="nav-btn active"
                    onclick="loadReport(report1, this)">
                <span class="icon">🏆</span>
                <span class="text">Champion Challenger</span>
            </button>

            <button class="nav-btn"
                    onclick="loadReport(report2, this)">
                <span class="icon">📈</span>
                <span class="text">Productivity Report</span>
            </button>

            <button class="nav-btn"
                    onclick="loadReport(report3, this)">
                <span class="icon">📋</span>
                <span class="text">B2B Training Grid</span>
            </button>
            

            <button class="nav-btn"
                    onclick="loadReport(report4, this)">
                <span class="icon">📊</span>
                <span class="text">GET Dashboard</span>
            </button>

            <button class="nav-btn"
                    onclick="loadReport(report5, this)">
                <span class="icon">📌</span>
                <span class="text">GET Agent Performance</span>
            </button>

        </div>
    </div>

    <!-- Report Viewer -->
    <div class="main-content">
        <div class="report-container">
            <iframe
                id="reportFrame"
                src="https://app.powerbi.com/view?r=eyJrIjoiOWM5YzhhNDgtYTM1YS00ZWU0LWI2MjEtNzEzMzYwZGJkYzFmIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D"
                title="Power BI Report"
                allowfullscreen>
            </iframe>
        </div>
    </div>

</div>

<script>

    // Power BI Reports

    const report1 =
        "https://app.powerbi.com/view?r=eyJrIjoiOWM5YzhhNDgtYTM1YS00ZWU0LWI2MjEtNzEzMzYwZGJkYzFmIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";

    const report2 =
        "https://app.powerbi.com/view?r=eyJrIjoiZWUwNDVmMjktZWVjNC00ZDQwLTlhMDctYjhjNzgzOGRmNWYyIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";

    const report3 =
        "https://app.powerbi.com/view?r=eyJrIjoiOWQxMGZlMDAtYzEzZC00MDA4LTkwNDEtNDNmNDBkOTg3ZTI3IiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";

    const report4 =
        "https://app.powerbi.com/view?r=eyJrIjoiNjQ3NDM0MDEtMGZjNy00NTgwLTk5MGYtODA4YWYxMWZjZTNiIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";
    
    const report5 =
        "https://app.powerbi.com/view?r=eyJrIjoiODgxNTAyOWEtMDY3Yy00YTYyLWJlZGEtZjRiMjM0NzE5OTM3IiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";


    // Report Loader

    function loadReport(url, button) {

        document.getElementById("reportFrame").src = url;

        document.querySelectorAll(".nav-btn")
            .forEach(btn => btn.classList.remove("active"));

        button.classList.add("active");
    }

    // Sidebar Toggle

    function toggleSidebar() {
        document.getElementById("sidebar")
            .classList.toggle("collapsed");
    }

</script>

</body>
</html>
