<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power BI Reports Portal</title>

    <!-- Standard Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6978764838614552" crossorigin="anonymous"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Bulletproof Viewport Fix: Pinned absolute positioning */
        html, body {
            width: 100vw;
            height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden; 
            background: #f5f5f5;
        }

        .layout {
            position: absolute;
            inset: 0; /* Equivalent to top:0; right:0; bottom:0; left:0; */
            display: flex;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            height: 100%;
            background: #0078d4;
            color: white;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
            z-index: 10;
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            height: 60px;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        .sidebar.collapsed .sidebar-title {
            display: none;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 22px;
            padding: 5px;
        }

        /* Fixed 1/3 Height Navigation Container */
        .nav-wrapper {
            height: 33.33vh; /* Exactly 1/3 of the viewport height */
            flex-shrink: 0;
            overflow-y: auto; /* Scroll if content overflows this 1/3 space */
        }

        /* Custom Scrollbar for Nav */
        .nav-wrapper::-webkit-scrollbar {
            width: 6px;
        }
        .nav-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.3);
            border-radius: 3px;
        }

        .nav-menu {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 14px 12px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255,255,255,0.12);
            color: white;
            transition: all 0.25s ease;
            flex-shrink: 0;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.22);
        }

        .nav-btn.active {
            background: white;
            color: #0078d4;
        }

        .icon {
            min-width: 24px;
            text-align: center;
            font-size: 18px;
        }

        .text {
            white-space: nowrap;
        }

        .sidebar.collapsed .text {
            display: none;
        }

        /* The Footer gets all remaining space */
        .sidebar-footer {
            flex-grow: 1; /* Expands to fill the remaining 2/3 space */
            display: flex;
            flex-direction: column;
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .sidebar.collapsed .sidebar-footer {
            display: none;
        }

        /* Ad Containers */
        .sidebar-ad-box {
            flex-grow: 1; /* Stretches dynamically to use all available footer space */
            position: relative;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
            margin-bottom: 12px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .banner-ad-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            background: #fff;
        }

        /* Top and bottom banners */
        .top-ad-banner, .bottom-ad-banner {
            height: 90px;
            width: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .top-ad-banner { border-bottom: 1px solid #ddd; }
        .bottom-ad-banner { border-top: 1px solid #ddd; }

        .custom-ad-fallback {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            color: white;
            z-index: 1;
        }

        .custom-ad-fallback h4 { font-size: 14px; margin-bottom: 4px; }
        .custom-ad-fallback p { font-size: 11px; opacity: 0.9; }

        .adsbygoogle {
            position: relative;
            z-index: 2;
        }

        .legal-links {
            text-align: center;
            flex-shrink: 0;
        }

        .legal-links a {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }

        .legal-links a:hover {
            color: white;
            text-decoration: underline;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
            min-width: 0; /* Flex layout boundary fix */
        }

        .report-container {
            flex: 1;
            width: 100%;
            min-height: 0; /* CRITICAL: Prevents iframe from breaking flex boundaries */
            display: flex;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
            }
            .sidebar.collapsed { width: 0; }
            .sidebar.collapsed * { display: none; }
        }
    </style>
</head>
<body>

<div class="layout">

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">Reports Portal</span>
            <button class="toggle-btn" onclick="toggleSidebar()">☰</button>
        </div>

        <div class="nav-wrapper">
            <div class="nav-menu">
                <button class="nav-btn active" onclick="loadReport(report1, this)">
                    <span class="icon">📊</span><span class="text">Champion Challenger</span>
                </button>
                <button class="nav-btn" onclick="loadReport(report2, this)">
                    <span class="icon">📈</span><span class="text">Productivity Report</span>
                </button>
                <button class="nav-btn" onclick="loadReport(report3, this)">
                    <span class="icon">📋</span><span class="text">B2B Training Grid</span>
                </button>
                <button class="nav-btn" onclick="loadReport(report4, this)">
                    <span class="icon">🎯</span><span class="text">GET Dashboard</span>
                </button>
                <button class="nav-btn" onclick="loadReport(report5, this)">
                    <span class="icon">⭐</span><span class="text">GET Agent Performance</span>
                </button>
            </div>
        </div>

        <div class="sidebar-footer">
            <!-- Sidebar Ad (Never unloads) -->
            <div id="sidebarAdBox" class="sidebar-ad-box">
                <!-- Injected via JS -->
            </div>

            <div class="legal-links">
                <a href="privacy-policy.html">Privacy Policy</a>
                <a href="terms.html">Terms of Service</a>
                <a href="cookie-policy.html">Cookie Policy</a>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContentArea">
        
        <!-- Dynamic Top Ad Wrapper (Script will inject and potentially destroy this) -->
        <div id="topAdWrapper" class="banner-ad-wrapper"></div>

        <!-- Power BI Report Viewer -->
        <div class="report-container">
            <iframe
                id="reportFrame"
                src="https://app.powerbi.com/view?r=eyJrIjoiOWM5YzhhNDgtYTM1YS00ZWU0LWI2MjEtNzEzMzYwZGJkYzFmIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D"
                title="Power BI Report"
                allowfullscreen>
            </iframe>
        </div>

        <!-- Dynamic Bottom Ad Wrapper (Script will inject and potentially destroy this) -->
        <div id="bottomAdWrapper" class="banner-ad-wrapper"></div>

    </div>

</div>

<script>
    const report1 = "https://app.powerbi.com/view?r=eyJrIjoiOWM5YzhhNDgtYTM1YS00ZWU0LWI2MjEtNzEzMzYwZGJkYzFmIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";
    const report2 = "https://app.powerbi.com/view?r=eyJrIjoiZWUwNDVmMjktZWVjNC00ZDQwLTlhMDctYjhjNzgzOGRmNWYyIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";
    const report3 = "https://app.powerbi.com/view?r=eyJrIjoiOWQxMGZlMDAtYzEzZC00MDA4LTkwNDEtNDNmNDBkOTg3ZTI3IiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";
    const report4 = "https://app.powerbi.com/view?r=eyJrIjoiNjQ3NDM0MDEtMGZjNy00NTgwLTk5MGYtODA4YWYxMWZjZTNiIiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";
    const report5 = "https://app.powerbi.com/view?r=eyJrIjoiODgxNTAyOWEtMDY3Yy00YTYyLWJlZGEtZjRiMjM0NzE5OTM3IiwidCI6IjIzZjhlY2ZiLTZhOTAtNDZjMi05NmNhLTRhMzYyNzIxYjgyYyIsImMiOjEwfQ%3D%3D";

    function loadReport(url, button) {
        document.getElementById("reportFrame").src = url;
        document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
    }

    // ---------------------------------------------------------
    // DYNAMIC DOM AD MANAGER
    // ---------------------------------------------------------
    const customAdPool = [
        { title: "MIS Digital Transformation", text: "Automating workflows for a smarter tomorrow.", bg: "linear-gradient(90deg, #1e3c72 0%, #2a5298 100%)" },
        { title: "Data Analytics Hub", text: "Empowering decisions with real-time insights.", bg: "linear-gradient(90deg, #0052d4 0%, #4364f7 50%, #6fb1fc 100%)" },
        { title: "Operations Excellence", text: "Driving productivity through innovative toolsets.", bg: "linear-gradient(90deg, #11998e 0%, #38ef7d 100%)" }
    ];

    function getRandomFallback() {
        return customAdPool[Math.floor(Math.random() * customAdPool.length)];
    }

    // Sidebar Ad logic: Injects once, stays forever. NEVER unloads.
    function initializeSidebarAd() {
        const container = document.getElementById('sidebarAdBox');
        if (!container) return;

        const ad = getRandomFallback();
        container.innerHTML = `
            <div class="custom-ad-fallback" style="background: ${ad.bg}">
                <h4>⚡ ${ad.title}</h4><p>${ad.text}</p>
            </div>
            <ins class="adsbygoogle"
                style="display:inline-block; width:100%; height:100%; min-height:250px;"
                data-ad-client="ca-pub-6978764838614552"
                data-ad-slot="9156007073"
                data-ad-format="vertical"></ins>
        `;

        const insTag = container.querySelector('ins.adsbygoogle');
        const fallback = container.querySelector('.custom-ad-fallback');

        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'data-ad-status' && insTag.getAttribute('data-ad-status') === 'filled') {
                    if(fallback) fallback.remove(); // Ad loaded, remove fallback layer
                    observer.disconnect();
                }
            });
        });

        observer.observe(insTag, { attributes: true });
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}
    }

    // Banner Ad Logic (Top/Bottom): Injects into DOM, completely DESTROYS the DOM element if not filled in 10s.
    function mountVolatileBanner(wrapperId, adSlot, className) {
        const wrapper = document.getElementById(wrapperId);
        if (!wrapper) return;

        // 1. Dynamically create the ad structure
        const ad = getRandomFallback();
        const bannerHtml = document.createElement('div');
        bannerHtml.className = className;
        bannerHtml.innerHTML = `
            <div class="custom-ad-fallback" style="background: ${ad.bg}">
                <h4>⚡ ${ad.title}</h4>
            </div>
            <ins class="adsbygoogle"
                style="display:inline-block; width:100%; height:90px;"
                data-ad-client="ca-pub-6978764838614552"
                data-ad-slot="${adSlot}"
                data-ad-format="horizontal"></ins>
        `;
        wrapper.appendChild(bannerHtml);

        const insTag = bannerHtml.querySelector('ins.adsbygoogle');
        const fallback = bannerHtml.querySelector('.custom-ad-fallback');
        let isFilled = false;

        // 2. Watch for AdSense to fill
        const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
                if (mutation.attributeName === 'data-ad-status' && insTag.getAttribute('data-ad-status') === 'filled') {
                    isFilled = true;
                    if (fallback) fallback.remove(); 
                }
            });
        });
        
        observer.observe(insTag, { attributes: true });
        try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) {}

        // 3. The 10-Second Unload Script: Completely removes the element from the DOM structure
        setTimeout(() => {
            if (!isFilled) {
                observer.disconnect();
                wrapper.remove(); // Completely destroys the wrapper, reclaiming the space natively
            }
        }, 10000);
    }

    // Initialize all ads
    window.addEventListener('DOMContentLoaded', () => {
        initializeSidebarAd();
        mountVolatileBanner('topAdWrapper', '1577347061', 'top-ad-banner');
        mountVolatileBanner('bottomAdWrapper', '9541440879', 'bottom-ad-banner');
    });

</script>

</body>
</html>
