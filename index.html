    <style>
        * {

            box-sizing: border-box;

        html, body {
            height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
            overflow: hidden;
        }

        .layout {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: #0078d4;
            color: white;
            transition: width 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 2px 0 8px rgba(0,0,0,0.15);
        }

        .sidebar.collapsed {
            width: 70px;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            min-height: 60px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .sidebar-title {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
        }

        .sidebar.collapsed .sidebar-title {
            display: none;
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 22px;
            padding: 5px;
        }

        .nav-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .nav-menu {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            padding: 14px 12px;
            font-size: 14px;
            font-weight: 600;
            background: rgba(255,255,255,0.12);
            color: white;
            transition: all 0.25s ease;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.22);
        }

        .nav-btn.active {
            background: white;
            color: #0078d4;
        }

        .icon {
            min-width: 24px;
            text-align: center;
            font-size: 18px;
        }

        .text {
            white-space: nowrap;
        }

        .sidebar.collapsed .text {
            display: none;
        }

        .sidebar-footer {
            padding: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.1);
        }

        .sidebar.collapsed .sidebar-footer {
            display: none;
        }

        /* Sidebar Ad Box - Hidden until rendered */
        .sidebar-ad-box {
            display: none;
            min-height: 250px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin-bottom: 12px;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .legal-links {
            text-align: center;
        }

        .legal-links a {
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-bottom: 5px;
        }

        .legal-links a:hover {
            color: white;
            text-decoration: underline;
        }

        .main-content {
            flex: 1;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Ad Banner Container - Hidden until rendered */
        .top-ad-banner {
            display: none;
            width: 100%;
            min-height: 70px;
            background: #fff;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #ddd;
            overflow: hidden;
        }

        .report-container {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: white;
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                z-index: 1000;
                height: 100vh;
            }
            .sidebar.collapsed {
                width: 0;
            }
            .sidebar.collapsed * {
                display: none;
            }
        }
    </style>
</head>

    function loadReport(url, button) {
        document.getElementById("reportFrame").src = url;
        document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.remove("active"));
        button.classList.add("active");
    }

    function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("collapsed");
    }

    // Adsterra Rendering Monitor & 2-Minute Hide Timer
    function monitorAdsterraContainer(containerId, displayStyle = 'flex') {
        const container = document.getElementById(containerId);
        if (!container) return;

        let timerStarted = false;

        function showContainerAndStartTimer() {
            if (timerStarted) return;
            timerStarted = true;

            // Reveal container once Adsterra injects an ad element
            container.style.display = displayStyle;

            // Automatically hide container after 2 minutes (120,000 ms)
            setTimeout(() => {
                container.style.display = 'none';
            }, 120000);
        }

        // Observer listens for dynamic DOM injection inside the container
        const observer = new MutationObserver(() => {
            const hasAdContent = container.querySelector('iframe, script, div') !== null;
            if (hasAdContent) {
                showContainerAndStartTimer();
            }
        });

        observer.observe(container, { childList: true, subtree: true });

        // Polling fallback check
        const checkInterval = setInterval(() => {
            if (container.querySelector('iframe') !== null) {
                showContainerAndStartTimer();
                clearInterval(checkInterval);
            }
        }, 1000);

        setTimeout(() => clearInterval(checkInterval), 15000);
    }

    window.addEventListener('DOMContentLoaded', () => {
        monitorAdsterraContainer('topAdBanner', 'flex');
        monitorAdsterraContainer('sidebarAdBox', 'flex');
    });
</script>
